[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncet"
version = "0.2.0"
description = "Neural-network Constraint Embedding Toolkit"
readme = "README.md"
authors = [{ name = "Wangkun Xu" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "neural networks",
    "mixed-integer optimization",
    "constraint embedding",
    "pytorch",
    "cvxpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cvxpy>=1.7.5,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/xuwkk/ncet"
Documentation = "https://xuwkk.github.io/ncet/"
Repository = "https://github.com/xuwkk/ncet.git"
Issues = "https://github.com/xuwkk/ncet/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
